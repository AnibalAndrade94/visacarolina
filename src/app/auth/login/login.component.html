<div class="container py-4" style="max-width: 520px;">
    <h2 class="mb-3">Iniciar sesión</h2>
    <p class="text-muted mb-4">Accede a tu cuenta para continuar.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

        <div class="mb-3">
            <label class="form-label">Correo *</label>
            <input class="form-control" formControlName="email" placeholder="correo@ejemplo.com" autocomplete="email">
            <div class="text-danger small mt-1" *ngIf="submitted && f.email.invalid">
                <span *ngIf="f.email.errors?.['required']">Este campo es obligatorio.</span>
                <span *ngIf="f.email.errors?.['email']">Correo inválido.</span>
            </div>
        </div>

        <div class="mb-2">
            <label class="form-label">Contraseña *</label>
            <input class="form-control" type="password" formControlName="password" placeholder="Tu contraseña" autocomplete="current-password">
            <div class="text-danger small mt-1" *ngIf="submitted && f.password.invalid">
                <span *ngIf="f.password.errors?.['required']">Este campo es obligatorio.</span>
                <span *ngIf="f.password.errors?.['minlength']">Mínimo 8 caracteres.</span>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" formControlName="rememberMe">
                <label class="form-check-label" for="remember">Recordarme</label>
            </div>

            <a class="small" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="alert alert-danger" *ngIf="errorMsg">
            {{ errorMsg }}
        </div>

        <button class="btn btn-primary w-100" [disabled]="loading">
      <span *ngIf="!loading">Entrar</span>
      <span *ngIf="loading">Entrando...</span>
    </button>

        <div class="text-center mt-3">
            <span class="text-muted">¿No tienes cuenta?</span>
            <a routerLink="/register" class="ms-1">Regístrate</a>
        </div>

    </form>
</div>
