<div class="container py-5 text-center">
    <div *ngIf="loading" class="py-4">
        <div class="spinner-border" role="status"></div>
        <p class="mt-3">Confirmando tu correo...</p>
    </div>

    <div *ngIf="!loading">
        <h2 *ngIf="status === 'success'">¡Listo!</h2>
        <h2 *ngIf="status === 'error'">Ups…</h2>
        <h2 *ngIf="status === 'missing'">Enlace incompleto</h2>

        <p class="mt-2">{{ message }}</p>

        <div class="mt-4" *ngIf="status !== 'success'">
            <a routerLink="/register" class="btn btn-primary">Volver a registro</a>
            <a routerLink="/login" class="btn btn-outline-secondary ms-2">Ir a login</a>
        </div>

        <div class="mt-4" *ngIf="status === 'success'">
            <a routerLink="/login" class="btn btn-primary">Iniciar sesión</a>
        </div>
    </div>
</div>
