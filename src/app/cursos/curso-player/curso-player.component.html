<section class="curso-player-section py-4 bg-vc-soft" *ngIf="curso">
    <div class="container">
        <div class="row g-4">

            <!-- Sidebar de módulos y lecciones -->
            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm modulo-list">
                    <div class="card-body">
                        <h2 class="boho bold600 tcolor mb-3" style="font-size: 1.4rem;">
                            {{ curso.titulo }}
                        </h2>
                        <p class="txtcolor small mb-3">
                            Selecciona la lección que quieres ver:
                        </p>

                        <div *ngFor="let modulo of curso.modulos" class="mb-3">
                            <h5 class="boho bold700 subcolor mb-2" style="font-size: 1rem;">
                                {{ modulo.titulo }}
                            </h5>

                            <ul class="list-unstyled ms-2">
                                <li *ngFor="let leccion of modulo.lecciones" (click)="setCurrentLesson(leccion)" class="lesson-item" [class.active]="currentLesson?.id === leccion.id">
                                    <span>{{ leccion.titulo }}</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Player -->
            <div class="col-md-8">
                <div class="card h-100 border-0 shadow-sm player-card">
                    <div class="card-body d-flex flex-column">
                        <h3 class="boho bold700 spacing subcolor mb-3" *ngIf="currentLesson">
                            {{ currentLesson.titulo }}
                        </h3>

                        <!-- Video -->
                        <div class="ratio ratio-16x9 mb-3" *ngIf="safeVideoUrl">
                            <iframe [src]="safeVideoUrl" frameborder="0" allowfullscreen></iframe>
                        </div>

                        <p class="txtcolor small" *ngIf="!safeVideoUrl">
                            Esta lección aún no tiene video configurado.
                        </p>

                        <p class="txtcolor mt-auto small">
                            * Recuerda: puedes pausar, regresar y repetir las lecciones las veces que necesites.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
