<!-- Save as: src/assets/icons/embassy-marker.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="42" viewBox="0 0 60 84">
  <defs>
    <!-- Gold gradient for the pin -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E3A6"/>
      <stop offset="0.45" stop-color="#C8A772"/>
      <stop offset="1" stop-color="#8F6F2E"/>
    </linearGradient>

    <!-- Inner bevel gradient -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4CE" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#C8A772" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6F5523" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- Clip for the round flag -->
    <clipPath id="flagClip">
      <circle cx="30" cy="28" r="17"/>
    </clipPath>

    <!-- Star pattern (simple, lightweight) -->
    <pattern id="stars" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M3 0.8 L3.7 2.4 L5.4 2.4 L4 3.4 L4.6 5.1 L3 4.1 L1.4 5.1 L2 3.4 L0.6 2.4 L2.3 2.4 Z"
            fill="#FFFFFF" opacity="0.95"/>
    </pattern>
  </defs>

  <!-- Pin body -->
  <path filter="url(#shadow)"
        d="M30 2
           C17.3 2 7 12.3 7 25
           C7 38.8 18.3 52.2 26.2 62.0
           L30 66.8
           L33.8 62.0
           C41.7 52.2 53 38.8 53 25
           C53 12.3 42.7 2 30 2 Z"
        fill="url(#goldGrad)"/>

  <!-- Inner bevel ring -->
  <circle cx="30" cy="28" r="20" fill="url(#bevelGrad)" opacity="0.9"/>
  <circle cx="30" cy="28" r="18.5" fill="#0E2A47" opacity="0.15"/>
  <circle cx="30" cy="28" r="18" fill="#F5F5F7"/>

  <!-- US flag (clipped in a circle) -->
  <g clip-path="url(#flagClip)">
    <!-- white base -->
    <rect x="13" y="11" width="34" height="34" fill="#FFFFFF"/>
    <!-- red stripes -->
    <g fill="#C0182C">
      <rect x="13" y="11" width="34" height="2.6"/>
      <rect x="13" y="16.2" width="34" height="2.6"/>
      <rect x="13" y="21.4" width="34" height="2.6"/>
      <rect x="13" y="26.6" width="34" height="2.6"/>
      <rect x="13" y="31.8" width="34" height="2.6"/>
      <rect x="13" y="37.0" width="34" height="2.6"/>
      <rect x="13" y="42.2" width="34" height="2.6"/>
    </g>

    <!-- blue canton -->
    <rect x="13" y="11" width="16.5" height="14.2" fill="#0E2A47"/>
    <!-- stars -->
    <rect x="13" y="11" width="16.5" height="14.2" fill="url(#stars)" opacity="0.95"/>
  </g>

  <!-- Flag border -->
  <circle cx="30" cy="28" r="17" fill="none" stroke="#C8A772" stroke-width="2"/>

  <!-- Small highlight -->
  <path d="M18 18 C22 10, 34 9, 38 14"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
</svg>
